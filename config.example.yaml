# 配置模板。使用方法：
#   1. 复制本文件为 config.yaml
#   2. 在 config.yaml 里填上你真正的 key
# 本文件不含真 key，可以安全地上传 / 分享。

deepseek_api_key: "sk-你的key填这里"
deepseek_model: "deepseek-chat"

# harness 用哪种记忆：naive | window | summary | rag | managed | managed_v2
memory:
  backend: managed
  recent_window: 6
  retrieve_top_k: 3
  summary_keep_recent: 2
  reflect_every: 6        # managed_v2 专用：每写入几条新记忆自动反思一次
